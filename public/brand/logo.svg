<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="face" x1="162" y1="84" x2="162" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a3e635" stop-opacity=".28"/>
      <stop offset="100%" stop-color="#4b7a12" stop-opacity=".05"/>
    </linearGradient>
    <linearGradient id="edge" x1="162" y1="76" x2="162" y2="308" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#e6ffb3"/>
      <stop offset="50%"  stop-color="#a3e635"/>
      <stop offset="100%" stop-color="#4b7a12"/>
    </linearGradient>
    <radialGradient id="vig" cx="46%" cy="40%" r="68%">
      <stop offset="0%"   stop-color="#0d1206"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
  </defs>

  <rect width="400" height="400" fill="url(#vig)"/>

  <!-- Incoming white beam, stopping at the prism face. -->
  <path d="M30 192 H116" stroke="#f2f5ee" stroke-width="17" stroke-linecap="round" opacity=".92"/>

  <!-- Prism, scaled to fill the circular crop rather than float inside it. -->
  <path d="M162 84 L252 300 H72 Z" fill="url(#face)" stroke="url(#edge)"
        stroke-width="17" stroke-linejoin="round"/>

  <!-- Refracted fan. Bands leave the prism's right edge and stop inside r=175
       of centre, so none of them is cut when X masks the avatar to a circle. -->
  <g stroke-width="17" stroke-linecap="round">
    <path d="M200 175 L356 128" stroke="#e6ffb3"/>
    <path d="M205 196 L364 170" stroke="#c9f56e"/>
    <path d="M210 218 L366 216" stroke="#a3e635"/>
    <path d="M215 240 L356 262" stroke="#79b520"/>
  </g>
</svg>
